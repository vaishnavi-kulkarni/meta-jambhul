# Start from Poky's reference distro defaults, then apply Jambhul's
# product-wide policy. Board-specific support is selected separately via MACHINE.
require conf/distro/poky.conf

DISTRO = "jambhul"

DISTRO_FEATURES:append = " wifi usrmerge"
INIT_MANAGER = "systemd"
hostname:pn-base-files = "jambhul"